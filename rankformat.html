<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rank Format</title>
  <style>
    :root {
      --panel: #31323a;
      --panel-2: #3a3544;
      --text: #f1f3f8;
      --muted: #a8abb6;
      --line: rgba(255, 255, 255, 0.08);
      --field: #24252c;
      --blue: #48a8ff;
      --gold: #f4b84a;
      --green: #3bd475;
      --pink: #ff4fa3;
      --cyan: #22c8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 16% 12%, rgba(72, 168, 255, 0.16), transparent 27rem),
        radial-gradient(circle at 86% 82%, rgba(255, 79, 163, 0.14), transparent 25rem),
        #16171c;
      color: var(--text);
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      padding: 28px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .bulletin {
      width: min(460px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      overflow: hidden;
    }

    .topbar {
      padding: 18px 18px 16px;
      background:
        linear-gradient(135deg, rgba(72, 168, 255, 0.28), transparent 38%),
        linear-gradient(315deg, rgba(255, 79, 163, 0.22), transparent 42%),
        #272832;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .discord-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
      margin-right: 8px;
      min-height: 34px;
      color: #ffffff;
      background: rgba(88, 101, 242, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 0 11px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
    }

    .discord-link:focus,
    .discord-link:hover {
      background: #5865f2;
    }

    .bot-link {
      background: rgba(56, 210, 119, 0.76);
    }

    .bot-link:focus,
    .bot-link:hover {
      background: #38d277;
      color: #111318;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #25262d;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      min-height: 44px;
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-weight: 800;
    }

    .tab[aria-selected="true"] {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 -3px 0 var(--blue);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .list {
      padding: 10px 0 14px;
    }

    .group {
      padding: 13px 14px 8px;
    }

    .group + .group {
      border-top: 1px solid var(--line);
    }

    .rank-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .count {
      color: #d7d9e0;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .rank-card {
      margin-top: 9px;
      min-height: 44px;
      display: grid;
      grid-template-columns: 36px 1fr auto;
      align-items: center;
      gap: 11px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.035);
      border-left: 3px solid var(--accent);
    }

    .rank-card.featured {
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.1), rgba(167, 119, 255, 0.18)),
        var(--panel-2);
    }

    .badge {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--accent) 22%, #202127);
      border: 1px solid color-mix(in srgb, var(--accent) 62%, transparent);
      color: var(--accent);
      font-size: 13px;
      font-weight: 900;
    }

    .rank-title {
      min-width: 0;
      color: var(--accent);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.15;
    }

    .rank-note {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag {
      justify-self: end;
      color: #e8e9f1;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 7px;
      font-size: 11px;
      font-weight: 800;
    }

    .founder { --accent: var(--blue); }
    .cofounder { --accent: var(--gold); }
    .headadmin { --accent: var(--green); }
    .t3 { --accent: var(--pink); }
    .t2 { --accent: #55d98e; }
    .t1 { --accent: var(--cyan); }
    .testing { --accent: #ffd35c; }

    .editor {
      padding: 16px;
    }

    .lock-box,
    .editor-tools,
    .edit-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      padding: 12px;
    }

    .lock-row,
    .editor-tools {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .lock-row {
      margin-top: 10px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input,
    textarea {
      width: 100%;
      min-height: 38px;
      color: var(--text);
      background: var(--field);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 10px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--blue);
    }

    textarea {
      resize: vertical;
      min-height: 58px;
    }

    .button {
      min-height: 38px;
      border: 0;
      color: #111318;
      background: var(--blue);
      padding: 0 13px;
      cursor: pointer;
      font-weight: 900;
      white-space: nowrap;
    }

    .button.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .button.danger {
      color: var(--text);
      background: rgba(255, 79, 163, 0.2);
      border: 1px solid rgba(255, 79, 163, 0.28);
    }

    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .status {
      margin-top: 8px;
      color: #ffb7d8;
      font-size: 12px;
      min-height: 17px;
    }

    .editor-tools {
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .edit-list {
      display: grid;
      gap: 10px;
    }

    .edit-card {
      display: grid;
      gap: 10px;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: 1fr 84px;
      gap: 10px;
    }

    .editor.locked .unlocked-only {
      display: none;
    }

    .editor:not(.locked) .locked-only {
      display: none;
    }

    @media (max-width: 430px) {
      body {
        padding: 0;
        place-items: stretch;
        background: #202127;
      }

      .bulletin {
        width: 100%;
        min-height: 100vh;
        border: 0;
      }

      .rank-card {
        grid-template-columns: 34px 1fr;
      }

      .tag {
        grid-column: 2;
        justify-self: start;
        margin-top: -3px;
      }

      .lock-row,
      .editor-tools {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="bulletin" aria-label="Rank bulletin">
    <section class="topbar">
      <h1>Skywalker Rank Bulletin</h1>
      <div class="subtitle">Ranks only. No member names shown.</div>
      <a class="discord-link" href="https://discord.gg/euNMeqpjp" target="_blank" rel="noopener">Join Discord</a>
      <a class="discord-link bot-link" href="https://discord.com/oauth2/authorize?client_id=1510112914730913894&scope=bot%20applications.commands&permissions=0" target="_blank" rel="noopener">Add Bot</a>
    </section>

    <nav class="tabs" aria-label="Bulletin tabs">
      <button class="tab" id="viewTab" type="button" aria-selected="true" aria-controls="viewPanel">Bulletin</button>
      <button class="tab" id="editTab" type="button" aria-selected="false" aria-controls="editPanel">Edit Ranks</button>
    </nav>

    <section class="panel active" id="viewPanel" aria-labelledby="viewTab">
      <div class="list" id="rankList"></div>
    </section>

    <section class="panel" id="editPanel" aria-labelledby="editTab">
      <div class="editor locked" id="editor">
        <div class="lock-box locked-only">
          <label for="codeInput">Enter Edit Code</label>
          <div class="lock-row">
            <input id="codeInput" type="password" autocomplete="off" placeholder="Code" />
            <button class="button" id="unlockButton" type="button">Unlock</button>
          </div>
          <div class="status" id="lockStatus" aria-live="polite"></div>
        </div>

        <div class="unlocked-only">
          <div class="editor-tools">
            <button class="button secondary" id="addRankButton" type="button">Add Rank</button>
            <button class="button danger" id="resetButton" type="button">Reset</button>
          </div>
          <div class="edit-list" id="editList"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const EDIT_CODE = "SKY2026";
    const STORAGE_KEY = "rankformat-data";
    const accents = ["founder", "cofounder", "headadmin", "t3", "t2", "t1", "testing"];
    const defaults = [
      { name: "Founder", count: 1, badge: "F", note: "Server owner rank", tag: "TOP", accent: "founder", featured: true },
      { name: "Co-Founder", count: 1, badge: "CF", note: "Leadership rank", tag: "LEAD", accent: "cofounder", featured: false },
      { name: "Head Admin", count: 1, badge: "HA", note: "Main staff rank", tag: "STAFF", accent: "headadmin", featured: false },
      { name: "Skywalker T3", count: 1, badge: "T3", note: "★★★ tier", tag: "ELITE", accent: "t3", featured: false },
      { name: "Skywalker T2", count: 3, badge: "T2", note: "★★ tier", tag: "SMP", accent: "t2", featured: false },
      { name: "Skywalker T1", count: 5, badge: "T1", note: "★ tier", tag: "ACTIVE", accent: "t1", featured: true },
      { name: "Awaiting Testing", count: 2, badge: "?", note: "Pending placement", tag: "QUEUE", accent: "testing", featured: false }
    ];

    let ranks = loadRanks();

    const rankList = document.querySelector("#rankList");
    const editList = document.querySelector("#editList");
    const editor = document.querySelector("#editor");
    const lockStatus = document.querySelector("#lockStatus");
    const codeInput = document.querySelector("#codeInput");

    function loadRanks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) && saved.length ? saved : structuredClone(defaults);
      } catch {
        return structuredClone(defaults);
      }
    }

    function saveRanks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(ranks));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderBulletin() {
      rankList.innerHTML = ranks.map((rank) => `
        <article class="group">
          <div class="rank-heading">
            <span>${escapeHtml(rank.name || "Untitled Rank")}</span>
            <span class="count">${Number(rank.count) || 0}</span>
          </div>
          <div class="rank-card ${rank.featured ? "featured" : ""} ${rank.accent || "t1"}">
            <div class="badge">${escapeHtml(rank.badge || "?")}</div>
            <div>
              <div class="rank-title">${escapeHtml(rank.name || "Untitled Rank")}</div>
              <div class="rank-note">${escapeHtml(rank.note || "No note")}</div>
            </div>
            <div class="tag">${escapeHtml(rank.tag || "RANK")}</div>
          </div>
        </article>
      `).join("");
    }

    function renderEditor() {
      editList.innerHTML = ranks.map((rank, index) => `
        <article class="edit-card">
          <div class="edit-grid">
            <div>
              <label for="name-${index}">Rank Name</label>
              <input id="name-${index}" data-index="${index}" data-field="name" value="${escapeHtml(rank.name)}" />
            </div>
            <div>
              <label for="count-${index}">Count</label>
              <input id="count-${index}" data-index="${index}" data-field="count" type="number" min="0" value="${Number(rank.count) || 0}" />
            </div>
          </div>
          <div class="edit-grid">
            <div>
              <label for="note-${index}">Note</label>
              <input id="note-${index}" data-index="${index}" data-field="note" value="${escapeHtml(rank.note)}" />
            </div>
            <div>
              <label for="badge-${index}">Badge</label>
              <input id="badge-${index}" data-index="${index}" data-field="badge" maxlength="3" value="${escapeHtml(rank.badge)}" />
            </div>
          </div>
          <div class="edit-grid">
            <div>
              <label for="tag-${index}">Tag</label>
              <input id="tag-${index}" data-index="${index}" data-field="tag" value="${escapeHtml(rank.tag)}" />
            </div>
            <div>
              <label for="move-${index}">Remove</label>
              <button class="button secondary" data-remove="${index}" id="move-${index}" type="button">Delete</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function sync() {
      saveRanks();
      renderBulletin();
      renderEditor();
    }

    async function loadLiveRanks() {
      try {
        const response = await fetch(`ranks.json?cache=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) return;
        const liveRanks = await response.json();
        if (!Array.isArray(liveRanks) || !liveRanks.length) return;
        ranks = liveRanks.map((rank, index) => ({
          name: rank.name || "Untitled Rank",
          count: Number(rank.count) || 0,
          badge: rank.badge || String(rank.name || "?").slice(0, 2).toUpperCase(),
          note: rank.note || "Live Discord rank",
          tag: rank.tag || "LIVE",
          accent: rank.accent || accents[index % accents.length],
          featured: Boolean(rank.featured)
        }));
        renderBulletin();
        renderEditor();
      } catch {
        // Local files and offline previews still use the built-in ranks.
      }
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((item) => item.setAttribute("aria-selected", "false"));
        document.querySelectorAll(".panel").forEach((panel) => panel.classList.remove("active"));
        tab.setAttribute("aria-selected", "true");
        document.querySelector(`#${tab.getAttribute("aria-controls")}`).classList.add("active");
      });
    });

    document.querySelector("#unlockButton").addEventListener("click", () => {
      if (codeInput.value.trim().toUpperCase() === EDIT_CODE) {
        editor.classList.remove("locked");
        lockStatus.textContent = "";
        codeInput.value = "";
        return;
      }
      lockStatus.textContent = "Wrong code. Try again.";
    });

    codeInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        document.querySelector("#unlockButton").click();
      }
    });

    editList.addEventListener("input", (event) => {
      const input = event.target.closest("[data-index][data-field]");
      if (!input) return;
      const index = Number(input.dataset.index);
      const field = input.dataset.field;
      ranks[index][field] = field === "count" ? Math.max(0, Number(input.value) || 0) : input.value;
      saveRanks();
      renderBulletin();
    });

    editList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove]");
      if (!button) return;
      ranks.splice(Number(button.dataset.remove), 1);
      sync();
    });

    document.querySelector("#addRankButton").addEventListener("click", () => {
      const next = ranks.length % accents.length;
      ranks.push({
        name: "New Rank",
        count: 0,
        badge: "NR",
        note: "Rank note",
        tag: "NEW",
        accent: accents[next],
        featured: false
      });
      sync();
    });

    document.querySelector("#resetButton").addEventListener("click", () => {
      ranks = structuredClone(defaults);
      sync();
    });

    renderBulletin();
    renderEditor();
    loadLiveRanks();
  </script>
</body>
</html>
